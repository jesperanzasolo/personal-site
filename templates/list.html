{% extends "base.html" %}
{% import "macros.html" as m %}
{% block content %}
<header class="intro">
  <a class="home" href="{{ config.base_url | safe }}">{{ config.extra.name }}</a>
  <h1>{{ section.title }}</h1>
</header>
<section>
  {%- if section.pages | length > 0 %}
  {{ m::post_items(pages=section.pages, dates=true) }}
  {%- else %}
  <p class="muted">The first post is in progress.</p>
  {%- endif %}
</section>
{% endblock content %}
